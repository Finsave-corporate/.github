name: Atualizar perfil público

on:
  schedule:
    - cron: "10 5 * * *" # 06:10 em Luanda
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil-publico
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O script vive no repositório privado .github-private
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github-private
          token: ${{ secrets.ORG_STATS_TOKEN }}
          path: .privado

      - name: Gerar README (só totais)
        env:
          # Fine-grained PAT da organização, só leitura (Contents, Metadata, Issues, Pull requests)
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: python3 .privado/scripts/gerar_dashboard.py --publico .

      - name: Commit se mudou
        run: |
          git add profile
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza perfil público"
          git push
